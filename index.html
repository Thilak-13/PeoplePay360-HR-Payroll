<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeoplePay360 - HR & Payroll Platform</title>
    <!-- Inter Font & Tailwind CDN for clean enterprise styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              brand: {
                50: '#f8fafc',
                100: '#f1f5f9',
                500: '#2563eb',
                600: '#1d4ed8',
                700: '#1e40af',
                800: '#1e3a8a',
                900: '#0f172a',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Ensure default pointer cursor behavior across the UI and prevent carets on layout containers */
      html, body, #root {
        cursor: default;
      }
      button, a, [role="button"], select, input[type="button"], input[type="submit"] {
        cursor: pointer;
      }
      input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], textarea {
        cursor: text;
        -webkit-user-select: text;
        user-select: text;
      }
      /* Prevent accidental caret and text selection on chrome/shell elements */
      nav, aside, header, button, .no-select {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 font-sans antialiased selection:bg-slate-200 selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
